<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二万五千里——红军长征沉浸式VR展</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* 准星 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            transition: all 0.2s;
        }
        #crosshair.active {
            background-color: rgba(200, 50, 50, 0.9);
            transform: translate(-50%, -50%) scale(1.5);
        }

        /* 欢迎页面/加载遮罩 */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #f5f0e8 0%, #e3d9c6 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }
        .title {
            font-size: 3rem;
            color: #8b0000;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: 5px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 40px;
        }
        .instructions {
            background: rgba(255,255,255,0.6);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid #d5c8b5;
        }
        .instructions p {
            margin: 10px 0;
            color: #555;
            font-size: 0.95rem;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        #start-btn:hover {
            transform: scale(1.05);
            background-color: #a00000;
        }

        /* 详情弹窗 */
        #modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 85%;
            max-width: 900px;
            background: #fdfbf7;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 50;
            display: none;
            opacity: 0;
            transition: all 0.3s ease-out;
            border-left: 8px solid #8b0000;
        }
        #modal.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #modal.video-modal {
            max-width: 960px;
            padding: 30px;
            border-left: none;
            border-top: 6px solid #8b0000;
        }
        #modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
            z-index: 55;
        }
        #modal-close:hover { color: #333; }
        #modal-title {
            font-size: 2rem;
            color: #8b0000;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        #modal-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
            max-height: 60vh;
            overflow-y: auto;
        }
        #modal-video-container {
            width: 100%;
            display: none;
        }
        #modal-video-container video {
            width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            background: #000;
        }
        #modal-video-placeholder {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 1.1rem;
        }
        #modal-video-placeholder .play-icon {
            width: 60px;
            height: 60px;
            border: 3px solid #8b0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            color: #8b0000;
            font-size: 1.5rem;
        }
        .bili-iframe-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bili-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .bili-iframe-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .bili-episode-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        .bili-episode-btn {
            padding: 6px 18px;
            border: 1px solid #8b0000;
            background: transparent;
            color: #8b0000;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .bili-episode-btn:hover {
            background: rgba(139, 0, 0, 0.1);
        }
        .bili-episode-btn.active {
            background: #8b0000;
            color: #fff;
        }

        /* 虚拟摇杆 */
        #joystick {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            z-index: 10;
            display: none;
        }
        #joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #joystick-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            pointer-events: none;
        }

        /* 移动端提示 */
        #mobile-controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        @media (max-width: 768px) {
            #mobile-controls-hint { display: block; }
            .instructions { display: none; }
            .title { font-size: 2rem; }
            #modal { padding: 25px; width: 90%; }
            #modal-title { font-size: 1.5rem; }
            #modal.video-modal { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="title">二万五千里</div>
        <div class="subtitle">红军长征主题虚拟展馆</div>
        <div class="instructions">
            <p><strong>[ 电脑端 ]</strong></p>
            <p>移动：键盘 <b>W A S D</b> 或 <b>方向键</b></p>
            <p>视角：按住 <b>鼠标左键</b> 拖拽</p>
            <p>交互：点击中心准星对准的展板</p>
            <br>
            <p><strong>[ 手机端 ]</strong></p>
            <p>左半屏滑动移动，右半屏滑动转动视角，点击屏幕交互</p>
        </div>
        <button id="start-btn">开始长征之路</button>
    </div>

    <div id="crosshair"></div>
    <div id="mobile-controls-hint">左侧区域滑动移动 • 右侧区域滑动环视</div>

    <div id="joystick">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <div id="modal">
        <div id="modal-close">&#10006;</div>
        <h2 id="modal-title">标题</h2>
        <div id="modal-content">内容</div>
        <div id="modal-video-container">
            <video id="modal-video" controls playsinline preload="none">
                <!-- 替换此处 src 为您的视频素材地址 -->
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
        </div>
        <div id="modal-video-placeholder" style="display:none;">
            <div class="play-icon">&#9654;</div>
            <div>视频素材占位区域</div>
            <div style="font-size:0.9rem; margin-top:8px; color:#666;">请替换 HTML 中 video 标签的 src 属性</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

        // ==========================================

                signText: "血染湘江\n英魂不朽"
            },
            {
                id: "zhanqu3",
                time: "1935.01",
                title: "展区三：遵义会议",
                introText: `会议前的危机、参会人员、会议议程与决议内容。\n1935年1月15日至17日，中共中央政治局在贵州遵义召开扩大会议。集中解决了当时具有决定意义的军事路线和组织领导问题。\n结束了"左"倾教条主义错误在中央的统治，确立了毛泽东在党和红军中的领导地位。`,

                poemText: "《十六字令三首·其三》\n山，刺破青天锷未残。\n天欲堕，赖以拄其间。",

            },

                title: "展区四：四渡赤水 & 巧渡金沙江",
                introText: "四渡赤水的战术背景、四次渡河时间线、敌军部署。\n1935年1月至5月，中央红军在川黔滇边境灵活机动，四渡赤水，声东击西，巧妙调动和摆脱国民党军队的围追堵截。\n随后，红军急行军七天七夜，巧渡金沙江，彻底跳出了数十万敌军的包围圈。",
                videoTitle: "四渡赤水 · 影像纪实",
                videoBvids: [{bvid: "BV18A411e7Qj", page: 1}, {bvid: "BV1SD4y1S7PE", page: 1}, {bvid: "BV1fV411H7VK", page: 4}],
                poemText: "《十六字令三首·其一》\n山，快马加鞭未下鞍。\n惊回首，离天三尺三。",
                signText: "四渡赤水\n用兵如神"
            },
            {
                id: "zhanqu5",
                time: "1935.05",
                title: "展区五：飞夺泸定桥 + 翻雪山过草地",
                introText: "泸定桥战斗经过、雪山草地自然环境的极端挑战。\n1935年5月至8月，红军先头部队一昼夜急行军240里，沿着铁索飞夺泸定桥，为北上开辟了生命通道。\n随后，红军翻越海拔4000多米的夹金山等数座大雪山，穿越沼泽密布、荒无人烟的松潘草地。",
                videoTitle: "飞夺泸定桥与翻雪山过草地 · 影像纪实",
                videoBvids: [{bvid: "BV1fV411H7VK", page: 5}, {bvid: "BV1fV411H7VK", page: 6}, {bvid: "BV1fV411H7VK", page: 11}, {bvid: "BV1fV411H7VK", page: 12}],
                poemText: "《沁园春·雪》（节选）\n北国风光，千里冰封，万里雪飘。\n望长城内外，惟余莽莽；大河上下，顿失滔滔...\n俱往矣，数风流人物，还看今朝。",
                signText: "飞夺泸定桥\n翻越雪山草地"
            },
            {
                id: "zhanqu6",
                time: "1936.10",
                title: "展区六：会宁会师",
                introText: "三大主力行军路线、会师前的艰难历程、长征数据统计。\n1936年10月，红一、二、四方面军在甘肃会宁地区胜利会师。历时两年、转战14个省的长征宣告胜利结束。\n长征的胜利，是中国革命转危为安的关键，它保存和锻炼了革命的骨干力量。",
                videoTitle: "会宁会师 · 影像纪实",
                videoBvids: [{bvid: "BV1G64y147im", page: 1}],
                poemText: "《七律·长征》\n红军不怕远征难，万水千山只等闲。\n五岭逶迤腾细浪，乌蒙磅礴走泥丸。\n金沙水拍云崖暖，大渡桥横铁索寒。\n更喜岷山千里雪，三军过后尽开颜。",
                signText: "三军会师\n长征精神永放光芒"
            }
        ];

        // ==========================================
        // 2. 核心场景初始化
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0eae1);
        scene.fog = new THREE.Fog(0xf0eae1, 10, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.7, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfff8ee, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.5);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 150;
        dirLight.shadow.camera.bottom = -150;
        dirLight.shadow.camera.left = -100;
        dirLight.shadow.camera.right = 100;
        scene.add(dirLight);

        const interactableObjects = [];
        const collisionObjects = [];

        // 玩家角色与第三人称相机参数
        let standModel = null;
        let walkModel = null;
        let playerModel = null;
        let walkMixer = null;
        let isModelLoaded = false;
        let cameraYaw = 0;
        let cameraPitch = 0.3;
        const cameraDistance = 4.5;
        const cameraHeight = 2.2;
        const joystick = { x: 0, y: 0, active: false };

        // ==========================================
        // 3. 贴图生成器
        // ==========================================
        const wallColor = 0xf5f0e8;
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8, metalness: 0.1 });
        const ceilingWoodMaterial = new THREE.MeshStandardMaterial({ color: 0x3b2d22, roughness: 0.9 });
        const plainWallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 1 });
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x5c4533, roughness: 0.7 });
        const beamMat = new THREE.MeshStandardMaterial({ color: 0x4a3c2e, roughness: 0.8 });

        // 展厅背景纹理——请将此图片保存为同目录下的 bg.png
        const textureLoader = new THREE.TextureLoader();
        const bgTexture = new THREE.Texture();
        bgTexture.encoding = THREE.sRGBEncoding;

        // 第一个展厅 intro 墙背面长征路线图
        const routeTexture = textureLoader.load('chngzhengluxian.png');
        routeTexture.encoding = THREE.sRGBEncoding;

        // 生成长征主题程序化 fallback 背景（明亮暖色调山峦），在 bg.png 加载前显示
        function createFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#e8d5b5');   // 顶部：明亮暖米色（朝霞天空）
            grad.addColorStop(0.35, '#c9a87c'); // 上部：沙金色
            grad.addColorStop(0.65, '#8b4513'); // 中部：赭石色
            grad.addColorStop(1, '#5c1212');    // 底部：暗红色（山麓）
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            // 远景山脉（较亮的玫瑰红）
            ctx.fillStyle = '#7a2e2e';
            ctx.beginPath(); ctx.moveTo(0, 360);
            for (let x = 0; x <= 1024; x += 40) ctx.lineTo(x, 320 + Math.sin(x * 0.008) * 30 + Math.cos(x * 0.015) * 12);
            ctx.lineTo(1024, 512); ctx.lineTo(0, 512); ctx.closePath(); ctx.fill();
            // 近景山脉
            ctx.fillStyle = '#a83a3a';
            ctx.beginPath(); ctx.moveTo(0, 430);
            for (let x = 0; x <= 1024; x += 30) ctx.lineTo(x, 390 + Math.sin(x * 0.012) * 22 + Math.cos(x * 0.006) * 18);
            ctx.lineTo(1024, 512); ctx.lineTo(0, 512); ctx.closePath(); ctx.fill();
            // 装饰文字
            ctx.fillStyle = 'rgba(80, 40, 20, 0.35)';
            ctx.font = 'bold 48px "KaiTi", serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('长征 · 万水千山', 512, 200);
            ctx.font = '22px sans-serif';
            ctx.fillText('背景图加载中...', 512, 260);
            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
            tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.needsUpdate = true; return tex;
        }

        // 先用 fallback 纹理占位
        bgTexture.image = createFallbackTexture().image;
        bgTexture.minFilter = THREE.LinearFilter;
        bgTexture.magFilter = THREE.LinearFilter;
        bgTexture.wrapS = THREE.ClampToEdgeWrapping;
        bgTexture.wrapT = THREE.ClampToEdgeWrapping;
        bgTexture.needsUpdate = true;

        function applyBgTexture(image) {
            // 通过 Canvas 自动提亮 25%，避免背景图过暗
            const canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'brightness(1.25) contrast(1.05)';
            ctx.drawImage(image, 0, 0);
            bgTexture.image = canvas;
            bgTexture.needsUpdate = true;
            scene.traverse(function(obj) {
                if (obj.isMesh && obj.material && obj.material.map === bgTexture) {
                    obj.material.needsUpdate = true;
                }

                ctx.fillStyle = '#e8dfd1'; ctx.fillRect(sx, sy, sw, sh);
                const aspect = img.width / img.height;
                const rectAspect = sw / sh;
                let dx = sx, dy = sy, dw = sw, dh = sh;
                if (aspect > rectAspect) { dh = sw / aspect; dy = sy + (sh - dh) / 2; }
                else { dw = sh * aspect; dx = sx + (sw - dw) / 2; }
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.strokeStyle = '#b8a88c'; ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, sw, sh);
            }
            texture.needsUpdate = true;

        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // 背景——旧纸张质感
            ctx.fillStyle = '#f5f0e8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 做旧纹理
            ctx.fillStyle = 'rgba(139, 0, 0, 0.03)';
            for (let i = 0; i < 60; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 40 + 10, Math.random() * 4 + 1);
            }
            // 边框
            ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 6;
            ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
            ctx.strokeStyle = '#b89a6a'; ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            // 红星装饰
            ctx.fillStyle = '#8b0000';
            ctx.beginPath(); ctx.arc(canvas.width / 2, 46, 8, 0, Math.PI * 2); ctx.fill();
            // 文字
            ctx.fillStyle = '#5c1212';
            ctx.font = 'bold 44px "KaiTi", "STKaiti", serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const lines = text.split('\n');
            const lineHeight = 56;
            const startY = canvas.height / 2 - (lines.length - 1) * lineHeight / 2 + 6;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], canvas.width / 2, startY + i * lineHeight);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }

        function createTextTexture(gallery, type, bgImage, introImages = null) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            function wrapText(context, textStr, x, y, maxWidth, lineHeight) {
                const paragraphs = textStr.split('\n');
                let currentY = y;
                for (let p = 0; p < paragraphs.length; p++) {
                    const words = paragraphs[p].split('');
                    let line = '';
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n];
                        if (context.measureText(testLine).width > maxWidth && n > 0) {
                            context.fillText(line, x, currentY);
                            line = words[n];
                            currentY += lineHeight;
                        } else {
                            line = testLine;
                        }
                    }
                    context.fillText(line, x, currentY);
                    currentY += lineHeight + 20;
                }
            }

            if (type === 'intro') {
                canvas.width = 2048; canvas.height = 1024;
                // 背景——米色宣纸质感

                // 淡雅山水底纹（简单线条模拟）
                ctx.strokeStyle = 'rgba(139,0,0,0.06)'; ctx.lineWidth = 2;
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 200 + i * 40);
                    for (let x = 0; x < canvas.width; x += 50) {
                        ctx.lineTo(x, 200 + i * 40 + Math.sin(x * 0.01 + i) * 30);
                    }
                    ctx.stroke();
                }
                // 外框——木色厚重边框
                ctx.strokeStyle = '#5c4533'; ctx.lineWidth = 24; ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
                ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 4; ctx.strokeRect(44, 44, canvas.width - 88, canvas.height - 88);
                // 左侧竖排装饰条（模拟图集区域）
                ctx.fillStyle = '#e8dfd1'; ctx.fillRect(60, 60, 400, canvas.height - 120);
                ctx.strokeStyle = '#b8a88c'; ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {

                        ctx.strokeRect(sx, sy, sw, sh);

                        ctx.fillStyle = '#d5c8b5';

            } else if (type === 'poem') {
                canvas.width = 2048; canvas.height = 1024;
                // 宣纸底色
                ctx.fillStyle = '#f5f0e8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                // 淡雅底纹
                ctx.strokeStyle = 'rgba(139,0,0,0.04)'; ctx.lineWidth = 1;
                for (let i = 0; i < 30; i++) {
                    ctx.beginPath(); ctx.moveTo(0, i * 35);
                    for (let x = 0; x < canvas.width; x += 40) ctx.lineTo(x, i * 35 + Math.sin(x * 0.008) * 20);
                    ctx.stroke();

                ctx.fillStyle = '#3b2d22';

                ctx.beginPath(); ctx.arc(canvas.width - 45, 35, 35, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(45, canvas.height - 35, 35, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(canvas.width - 45, canvas.height - 35, 35, 0, Math.PI * 2); ctx.fill();
                // 内边框
                ctx.strokeStyle = '#b8a88c'; ctx.lineWidth = 3;
                ctx.strokeRect(80, 80, canvas.width - 160, canvas.height - 160);
                // 标题
                ctx.fillStyle = '#8b0000';
                ctx.font = 'bold 90px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillText("精神丰碑", canvas.width / 2, 110);
                // 竖排诗词
                ctx.fillStyle = '#8b0000';
                ctx.font = 'bold 72px "KaiTi", "STKaiti", "SimSun", serif';
                const paragraphs = gallery.poemText.split('\n');
                let colX = canvas.width - 220;
                const startY = 260;
                const lineHeight = 86;
                const colWidth = 100;
                for (let p = 0; p < paragraphs.length; p++) {
                    const chars = paragraphs[p].split('');
                    let currentY = startY;
                    for (let i = 0; i < chars.length; i++) {
                        if (currentY + lineHeight > canvas.height - 200 && i > 0) {
                            colX -= colWidth; currentY = startY;
                        }
                        ctx.fillText(chars[i], colX, currentY);
                        currentY += lineHeight;
                    }
                    colX -= colWidth * 1.6;
                }
                // 印章
                ctx.fillStyle = '#b22222';
                ctx.fillRect(180, canvas.height - 320, 180, 180);
                ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 4; ctx.strokeRect(190, canvas.height - 310, 160, 160);
                ctx.fillStyle = '#fdfbf7';

                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("长征", 270, canvas.height - 250);

            texture._sourceCanvas = canvas;

        function createBackPlane(wallMesh, texture) {
            const geo = wallMesh.geometry;
            const w = geo.parameters.width;
            const h = geo.parameters.height;
            const d = geo.parameters.depth;
            const backGeo = new THREE.PlaneGeometry(w, h);
            const backMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const backMesh = new THREE.Mesh(backGeo, backMat);
            const theta = wallMesh.rotation.y;
            const offset = d / 2 + 0.02;
            backMesh.position.set(
                wallMesh.position.x - Math.sin(theta) * offset,
                wallMesh.position.y,
                wallMesh.position.z - Math.cos(theta) * offset
            );
            backMesh.rotation.y = theta + Math.PI;
            wallMesh.parent.add(backMesh);
        }

            const targetHeight = 1.7;
            const scale = targetHeight / size.y;

        // 剔除动画中的整体位移（root motion），只保留原地踏步的肢体动作
        function removeRootMotion(clip) {
            for (let i = 0; i < clip.tracks.length; i++) {
                const track = clip.tracks[i];
                if (track.name.endsWith('.position')) {
                    const values = track.values;
                    const n = values.length / 3;
                    if (n < 2) continue;
                    const dx = values[values.length - 3] - values[0];
                    const dy = values[values.length - 2] - values[1];
                    const dz = values[values.length - 1] - values[2];
                    const disp = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    if (disp > 0.001) {
                        console.log('Removing root motion from track:', track.name, 'displacement:', disp.toFixed(4));
                        const duration = track.times[track.times.length - 1];
                        for (let j = 0; j < n; j++) {
                            const t = track.times[j] / duration;
                            values[j * 3] -= dx * t;
                            values[j * 3 + 2] -= dz * t;
                        }
                    }
                }
            }
        }

        document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });

        // 虚拟摇杆
        const joystickEl = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystick-knob');
        const joystickRadius = 70;
        const knobRadius = 28;
        const maxKnobDist = joystickRadius - knobRadius;

        function updateJoystickUI() {
            const dx = joystick.x * maxKnobDist;
            const dy = joystick.y * maxKnobDist;
            joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
        }

        function handleJoystickStart(clientX, clientY) {
            const rect = joystickEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < joystickRadius * 1.5) {
                joystick.active = true;
            }
        }

        function handleJoystickMove(clientX, clientY) {
            if (!joystick.active) return;
            const rect = joystickEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxKnobDist) {
                dx = dx / dist * maxKnobDist;
                dy = dy / dist * maxKnobDist;
            }
            joystick.x = dx / maxKnobDist;
            joystick.y = dy / maxKnobDist;
            updateJoystickUI();
        }

        function handleJoystickEnd() {
            joystick.active = false;
            joystick.x = 0;
            joystick.y = 0;
            updateJoystickUI();
        }

        joystickEl.addEventListener('mousedown', (e) => {
            e.preventDefault();
            handleJoystickStart(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (joystick.active) handleJoystickMove(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
            if (joystick.active) handleJoystickEnd();
        });

        joystickEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.changedTouches.length > 0) {
                handleJoystickStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }, { passive: false });
        joystickEl.addEventListener('touchmove', (e) => {
            e.preventDefault();

                handleJoystickMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);

                if (t.clientX >= window.innerWidth / 2) {
                    touchLookID = t.identifier;
                    lastTouchLookPos = { x: t.clientX, y: t.clientY };

                    updateCameraRotation(t.clientX - lastTouchLookPos.x, t.clientY - lastTouchLookPos.y, 0.005);

        function updateCameraRotation(deltaX, deltaY, sensitivity) {
            cameraYaw -= deltaX * sensitivity;

                    }

                    const bvids = data.videoBvids.map(item => typeof item === 'string' ? { bvid: item, page: 1 } : item);

                    const label = document.createElement('div');
                    label.className = 'bili-iframe-label';

                    iframe.allow = 'autoplay; fullscreen';

                    wrapper.appendChild(iframe);
                    modalVideoContainer.appendChild(label);
                    modalVideoContainer.appendChild(wrapper);

                    if (bvids.length > 1) {
                        const btnBar = document.createElement('div');
                        btnBar.className = 'bili-episode-bar';
                        const episodeButtons = [];
                        function switchEpisode(idx) {
                            currentBvidIndex = idx;
                            iframe.src = 'https://player.bilibili.com/player.html?bvid=' + bvids[idx].bvid + '&page=' + bvids[idx].page + '&high_quality=1&danmaku=0&autoplay=1';
                            label.innerText = '第 ' + (idx + 1) + ' / ' + bvids.length + ' 集';
                            episodeButtons.forEach((b, i) => b.classList.toggle('active', i === idx));
                        }
                        bvids.forEach((_, idx) => {
                            const btn = document.createElement('button');
                            btn.className = 'bili-episode-btn' + (idx === 0 ? ' active' : '');
                            btn.innerText = '第' + (idx + 1) + '集';

                            episodeButtons.push(btn);
                            btnBar.appendChild(btn);
                        });
                        modalVideoContainer.appendChild(btnBar);

                    activeBiliMessageHandler = function(e) {
                        let msg = e.data;
                        if (typeof msg === 'string') {
                            try { msg = JSON.parse(msg); } catch (err) { return; }
                        }
                        if (!msg || !msg.event) return;
                        if (msg.event === 'video::ended' || msg.event === 'ended') {
                            if (currentBvidIndex < bvids.length - 1) {

                    window.addEventListener('message', activeBiliMessageHandler);

            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                isStarted = true;
                joystickEl.style.display = 'block';
            }, 1000);
        });
        document.getElementById('modal-close').addEventListener('click', closeModal);
        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) closeModal();
        });

        // ==========================================
        // 7. 物理碰撞滑动检测
        // ==========================================
        const playerRadius = 0.5;
        function getSlideMoveVector(startPos, moveVec) {
            if (moveVec.length() === 0) return moveVec;
            let allowedMove = moveVec.clone();
            if (Math.abs(moveVec.x) > 0) {
                const dirX = new THREE.Vector3(Math.sign(moveVec.x), 0, 0);
                const rayX = new THREE.Raycaster(startPos, dirX, 0, playerRadius + Math.abs(moveVec.x));
                if (rayX.intersectObjects(collisionObjects).length > 0) allowedMove.x = 0;
            }
            if (Math.abs(moveVec.z) > 0) {
                const dirZ = new THREE.Vector3(0, 0, Math.sign(moveVec.z));
                const rayZ = new THREE.Raycaster(startPos, dirZ, 0, playerRadius + Math.abs(moveVec.z));
                if (rayZ.intersectObjects(collisionObjects).length > 0) allowedMove.z = 0;
            }
            return allowedMove;
        }

        // ==========================================
        // 8. 游戏主循环
        // ==========================================
        const clock = new THREE.Clock();
        const baseSpeed = 3.5;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (isStarted && !modalEl.classList.contains('show') && isModelLoaded && standModel && walkModel) {
                // 基于相机水平朝向计算前后左右（forward 为远离相机的方向）
                const forward = new THREE.Vector3(
                    -Math.sin(cameraYaw),
                    0,
                    -Math.cos(cameraYaw)
                ).normalize();
                const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                const speed = baseSpeed * delta;
                const moveVec = new THREE.Vector3(0, 0, 0);

                // 键盘输入
                if (keys.w || keys.ArrowUp) moveVec.addScaledVector(forward, speed);
                if (keys.s || keys.ArrowDown) moveVec.addScaledVector(forward, -speed);
                if (keys.a || keys.ArrowLeft) moveVec.addScaledVector(right, -speed);
                if (keys.d || keys.ArrowRight) moveVec.addScaledVector(right, speed);

                // 虚拟摇杆输入（摇杆 y 轴负值 = 向前）
                if (joystick.active || Math.abs(joystick.x) > 0.05 || Math.abs(joystick.y) > 0.05) {
                    moveVec.addScaledVector(forward, -joystick.y * speed);
                    moveVec.addScaledVector(right, joystick.x * speed);
                }

                // 碰撞检测并移动角色（只同步 x/z，y 保持各自独立的脚底高度）
                const playerPos = standModel.position;
                const finalMove = getSlideMoveVector(playerPos, moveVec);
                standModel.position.x += finalMove.x;
                standModel.position.z += finalMove.z;
                walkModel.position.x = standModel.position.x;
                walkModel.position.z = standModel.position.z;

                // 模型朝向移动方向（平滑转向）
                const isMoving = moveVec.length() > 0.001;
                if (isMoving) {
                    const targetRotation = Math.atan2(moveVec.x, moveVec.z);
                    let currentRotation = standModel.rotation.y;
                    let diff = targetRotation - currentRotation;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    const turnAmount = diff * Math.min(1, delta * 8);
                    standModel.rotation.y += turnAmount;
                    walkModel.rotation.y += turnAmount;
                }

                // 切换站立/走路模型
                if (isMoving) {
                    if (!walkModel.visible) {
                        walkModel.visible = true;
                        standModel.visible = false;
                        playerModel = walkModel;
                    }
                } else {
                    if (!standModel.visible) {
                        standModel.visible = true;
                        walkModel.visible = false;
                        playerModel = standModel;
                    }
                }

                // 播放走路动画并锁定位置（防止动画 root motion 影响坐标）
                if (walkMixer && walkModel.visible) {
                    const prevX = walkModel.position.x;
                    const prevZ = walkModel.position.z;
                    walkMixer.update(delta);
                    walkModel.position.x = prevX;
                    walkModel.position.z = prevZ;
                    walkModel.position.y = walkModel.userData.footY;
                }

                // 第三人称相机跟随
                const offset = new THREE.Vector3(
                    Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDistance,
                    Math.sin(cameraPitch) * cameraDistance + cameraHeight,
                    Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDistance
                );
                const targetCameraPos = standModel.position.clone().add(offset);
                camera.position.lerp(targetCameraPos, 0.12);
                camera.lookAt(standModel.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

                checkUIIntersections();
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
